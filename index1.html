<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Meu Primeiro Site</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Bem-vindo ao Meu Primeiro Site</h1>
    <div>
        <h1>Formulário de Inscrição</h1>                                                     
    </div>
    

  </header>

  <main>
    <h2>Preencha o formulário abaixo:</h2>


  <form action="#" method="post">

    <!-- campo de nome -->
    <label for="nome" class="label">Nome:</label>
    <input type="text" id="nome" name="nome" minlength="3" maxlength="50" required 
    placeholder="Digite seu nome"><br>
<br>
    <!-- campo de e-mail -->
    <label for="email" class="label">E-mail:</label>
    <input type="email" id="email" name="email" required placeholder="Pedro@gmail.com"><br>
<br>
    <!-- campo de telefone -->
    <label for="telefone" class="label">Telefone:</label>
    <input type="tel" id="telefone" name="telefone" pattern="\(\d{2}\) \d{4,5}-\d{4}" 
    placeholder="(11) 91234-5678" required><br>
<br>
  
    <label for="idade" class="label">Idade:</label>
    <input type="number" id="idade" name="idade" min="1" max="120" required><br>

   
    <p>Sexo:</p>
    <label for="sexo_masculino" class="label">Masculino</label>
    <input type="radio" id="sexo_masculino" name="sexo" value="masculino" required>

    <label for="sexo_feminino" class="label ">Feminino</label>
    <input type="radio" id="sexo_feminino" name="sexo" value="feminino">

    <label for="sexo_outro" class="label">Outro</label>
    <input type="radio" id="sexo_outro" name="sexo" value="outro"><br>

   
    <p>Interesses:</p>
    <label for="interesse_ti" class="label">Tecnologia</label>
    <input type="checkbox" id="interesse_ti" name="interesses" value="tecnologia">

    <label for="interesse_esporte" class="label">Esportes</label>
    <input type="checkbox" id="interesse_esporte" name="interesses" value="esportes"><br>
<br>
    <label for="cidade" class="label">Cidade:</label>
    <select id="cidade" name="cidade" required>
      <option value="">Selecione...</option>
      <option value="sao_paulo">São Paulo</option>
      <option value="rio_de_janeiro">Rio de Janeiro</option>
    </select><br><br>

   
    <label for="mensagem" class="label">Mensagem:</label><br>
    <textarea id="mensagem" name="mensagem" rows="3" maxlength="200"></textarea><br>
<br><br>

    <button type="submit">Enviar</button>
<br><br>
  </form>

   <figure>
    <img src="img-1283624_1920.jpg" alt="Foto de perfil do usuário" width="200">
  </figure>

  <br>
  <video controls poster="" width="400">
    <source src="video-2154818826-640_adpp_is.mp4" type="video/mp4">
    Seu navegador não suporta a exibição de vídeos.
  </video>
<br>
 
  <audio controls>
    <source src="audio.mp3" type="audio/mpeg">
    Seu navegador não suporta a reprodução de áudio.
  </audio>
<br>

</body>
</html>
